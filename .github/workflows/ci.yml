name: CI

on:
  push:
  pull_request:

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck entrypoint
        run: shellcheck entrypoint.sh tests/entrypoint-smoke.sh

      - name: Smoke-test entrypoint config generation
        run: tests/entrypoint-smoke.sh
